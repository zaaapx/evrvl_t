<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>(function(){var w=window.innerWidth,d=w>=1024?"desktop":w>=768?"tablet":"mobile";if(d!=="mobile"){var s={desktop:"404.html",tablet:"404-tablet.html",mobile:"404-mobile.html"};window.location.replace(s[d]);}})();</script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @font-face { font-family: "HeadingNow-84Regular"; src: url("./fonts/HeadingNow-84Regular.otf") format("opentype"); font-weight: 400; font-display: swap; }
    @font-face { font-family: "HeadingNow-82Light"; src: url("./fonts/HeadingNow-82Light.otf") format("opentype"); font-weight: 200; font-display: swap; }
    @import url("https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap");
    html, body { margin: 0; background: rgb(25,35,22); overflow-x: hidden; }
    a { color: #fff; text-decoration: none; }
    a:hover { color: rgba(255,255,255,0.7); }
  </style>
</helmet>
<div style="position: relative; width: 100%; height: 100svh; min-height: 560px; overflow: hidden; background: rgb(25,35,22); font-family: Outfit,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" data-om-label="404" data-screen-label="404 (mobile)">
  <video src="./assets/footer-video.mp4" poster="./assets/footer-beach.webp" autoPlay="{{ true }}" loop="{{ true }}" muted="{{ true }}" playsInline="{{ true }}" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center; display: block; pointer-events: none"></video>
  <div style="position: absolute; inset: 0; background: linear-gradient(180deg, rgba(10,18,12,0.85), rgba(10,18,12,0.62) 55%, rgba(10,18,12,0.78)); pointer-events: none"></div>
  <div style="position: fixed; left: 0; right: 0; top: calc(env(safe-area-inset-top, 0px) + 12px); height: 0; z-index: 400" data-om-label="header-mobile">
    <div style="position: relative; margin: 0 12px; z-index: 500; border-radius: 16px; background: rgba(0,0,0,0.3); backdrop-filter: blur(24px); display: flex; flex-direction: row; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 10px 10px 14px; box-sizing: border-box">
      <a href="./index-mobile.html" style="display: block; flex-shrink: 0; text-decoration: none"><img src="./assets/logo-mobile.svg" alt="EVERVILLE" style="width: 120px; height: 36px; display: block"></a>
      <div style="display: flex; flex-direction: row; align-items: center; gap: 6px">
        <div style="display: flex; flex-direction: row; gap: 4px; align-items: center; padding: 12px 10px; border-radius: 8px; cursor: pointer; transition: background-color 0.2s ease-out" style-hover="background-color: rgba(43,58,39,0.5)">
          <span style="font-weight: 700; font-size: 13px; color: #fff">RU</span>
          <svg width="12" height="6" viewBox="0 0 14 7" fill="#fff"><path d="M 7 7 L 0.938 1.75 L 13.062 1.75 L 7 7 Z"></path></svg>
        </div>
        <div onClick="{{ onToggleMenu }}" style="width: 45px; height: 45px; border-radius: 8px; background: rgba(255,255,255,0.14); display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0">
          <div style="position: relative; width: 22px; height: 22px; flex-shrink: 0">
            <span style="position: absolute; left: 1px; top: 6px; width: 20px; height: 1.5px; border-radius: 1px; background: #fff; transform: {{ barTop }}; transition: transform 0.4s cubic-bezier(.16,1,.3,1)"></span>
            <span style="position: absolute; left: 1px; top: 10.25px; width: 20px; height: 1.5px; border-radius: 1px; background: #fff; opacity: {{ barMidO }}; transform: {{ barMid }}; transition: opacity 0.2s ease-out, transform 0.4s cubic-bezier(.16,1,.3,1)"></span>
            <span style="position: absolute; left: 1px; top: 14.5px; width: 20px; height: 1.5px; border-radius: 1px; background: #fff; transform: {{ barBot }}; transition: transform 0.4s cubic-bezier(.16,1,.3,1)"></span>
          </div>
        </div>
      </div>
    </div>
    <div style="transform: {{ menuTransform }}; pointer-events: {{ menuPointer }}; visibility: {{ menuVis }}; transition: transform 0.55s cubic-bezier(.16,1,.3,1), visibility 0.55s linear; position: fixed; left: 0; width: 100%; top: 0; height: 100svh; z-index: 200; background: rgb(25,35,22); display: flex; flex-direction: column; padding: calc(env(safe-area-inset-top, 0px) + 92px) 16px 16px; box-sizing: border-box">
      <div style="display: flex; flex-direction: column; gap: 4px; flex: 1 1 auto; justify-content: center; align-items: center">
        <a href="./projects-mobile.html" style="font-family: 'HeadingNow-82Light'; font-weight: 200; font-size: 28px; line-height: 1.6; color: #fff; text-transform: uppercase; text-decoration: none">Проекты</a>
        <a href="./investments-mobile.html" style="font-family: 'HeadingNow-82Light'; font-weight: 200; font-size: 28px; line-height: 1.6; color: #fff; text-transform: uppercase; text-decoration: none">Инвестиции</a>
        <a href="./legal-mobile.html" style="font-family: 'HeadingNow-82Light'; font-weight: 200; font-size: 28px; line-height: 1.6; color: #fff; text-transform: uppercase; text-decoration: none">Юридика</a>
        <a href="./about-mobile.html" style="font-family: 'HeadingNow-82Light'; font-weight: 200; font-size: 28px; line-height: 1.6; color: #fff; text-transform: uppercase; text-decoration: none">О компании</a>
        <a href="./contacts-mobile.html" style="font-family: 'HeadingNow-82Light'; font-weight: 200; font-size: 28px; line-height: 1.6; color: #fff; text-transform: uppercase; text-decoration: none">Контакты</a>
      </div>
      <div style="display: flex; flex-direction: column; gap: 10px; align-items: stretch">
        <a href="./contacts-mobile.html" style="border-radius: 8px; background: #fff; display: flex; padding: 18px 24px; justify-content: center; align-items: center; box-sizing: border-box; cursor: pointer; text-decoration: none">
          <span style="font-weight: 700; font-size: 15px; line-height: 21px; color: rgb(43,58,39)">Инвестировать</span>
        </a>
        <div onClick="{{ goLogin }}" style="border-radius: 8px; background: rgba(43,58,39,0.65); display: flex; padding: 18px 24px; justify-content: center; align-items: center; box-sizing: border-box; cursor: pointer">
          <span style="font-weight: 700; font-size: 15px; line-height: 21px; color: #fff">Войти</span>
        </div>
      </div>
    </div>
  </div>
  <div style="position: relative; z-index: 5; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; gap: 24px; padding: 0 20px; box-sizing: border-box">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 6px">
      <span style="font-weight: 400; font-size: 12px; letter-spacing: 0.02em; color: rgb(214,158,158)">ошибка 404</span>
      <span style="font-family: 'HeadingNow-84Regular'; font-weight: 400; font-size: 72px; line-height: 1; color: #fff">404</span>
      <div style="display: flex; flex-direction: row; align-items: center; justify-content: center; gap: 12px; width: 100%">
        <span data-rule="left" style="flex: 0 0 auto; width: 48px; height: 2px; background: #fff; display: block; transform: scaleX(0); transform-origin: right center; transition: transform 0.9s cubic-bezier(.16,1,.3,1) 120ms"></span>
        <span style="font-family: 'HeadingNow-82Light'; font-weight: 200; font-size: 15px; line-height: 1.36; text-transform: uppercase; color: #fff; white-space: nowrap">страница не найдена</span>
        <span data-rule="right" style="flex: 0 0 auto; width: 48px; height: 2px; background: #fff; display: block; transform: scaleX(0); transform-origin: left center; transition: transform 0.9s cubic-bezier(.16,1,.3,1) 120ms"></span>
      </div>
    </div>
    <span style="max-width: 340px; font-weight: 400; font-size: 14px; line-height: 1.55; color: rgba(255,255,255,0.85)">Возможно, страница была перемещена или адрес введён с ошибкой. Начните с главной — или напишите нам.</span>
    <div style="display: flex; flex-direction: column; gap: 10px; align-items: stretch; width: 100%; max-width: 340px">
      <a href="./index-mobile.html" style="border-radius: 8px; background: #fff; display: flex; padding: 16px 24px; justify-content: center; align-items: center; text-decoration: none">
        <span style="font-weight: 700; font-size: 14px; line-height: 20px; color: rgb(43,58,39); white-space: nowrap">На главную</span>
      </a>
      <a href="./contacts-mobile.html" style="border-radius: 8px; background: rgba(255,255,255,0.14); backdrop-filter: blur(8px); display: flex; padding: 16px 24px; justify-content: center; align-items: center; text-decoration: none"><span style="font-weight: 700; font-size: 14px; line-height: 20px; color: #fff; white-space: nowrap">Связаться с нами</span></a>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  componentDidMount() {
    this._t = setTimeout(() => { document.querySelectorAll("[data-rule]").forEach((n) => { n.style.transform = "none"; }); }, 120);
  }
  componentWillUnmount() { clearTimeout(this._t); }
  renderVals() {
    const s = this.state || {};
    return {
      goLogin: () => window.open("https://portal.everville.estate/login", "_blank", "noopener"),
      onToggleMenu: () => this.setState(st => ({ menuOpen: !st.menuOpen })),
      barTop: s.menuOpen ? "translateY(4.25px) rotate(45deg)" : "none",
      barMid: s.menuOpen ? "scaleX(0.4)" : "none",
      barMidO: s.menuOpen ? 0 : 1,
      barBot: s.menuOpen ? "translateY(-4.25px) rotate(-45deg)" : "none",
      menuTransform: s.menuOpen ? "translateX(0)" : "translateX(100%)",
      menuPointer: s.menuOpen ? "auto" : "none",
      menuVis: s.menuOpen ? "visible" : "hidden"
    };
  }
}
</script>
</body>
</html>
